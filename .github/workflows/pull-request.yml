name: Pull Request
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    permissions:
      contents: write
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  publish:
    name: Publish preview release
    # prevents this action from running on forks
    if: github.repository == 'wevm/wagmi'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install dependencies
        uses: wevm/actions/.github/actions/pnpm@8963daf30237417f873c8e2f17e3bf9415e3a7b9
        with:
          node-version: 24.22.1

      - name: Publish to pkg.pr.new
        run: |
          pnpm changeset:prepublish
          pnpx pkg-pr-new publish --pnpm --compact './packages/*'
        env:
          PKG_PR_NEW: true

  size:
    name: Size
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install dependencies
        uses: wevm/actions/.github/actions/pnpm@8963daf30237417f873c8e2f17e3bf9415e3a7b9
        with:
          node-version: 24.22.1

      - name: Report build size
        uses: wevm/actions/vendor/preactjs/compressed-size-action/2.8.0@8963daf30237417f873c8e2f17e3bf9415e3a7b9
        with:
          pattern: 'packages/**/dist/**'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
